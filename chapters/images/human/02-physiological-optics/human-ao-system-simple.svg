<?xml version="1.0" encoding="UTF-8"?>
<!--
  Simplified adaptive-optics retinal-imaging schematic.
  Native SVG shapes and live text: intended for editing in Affinity.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Simplified adaptive-optics retinal imaging system</title>
  <desc id="desc">An orange illumination path travels from a laser through a beam splitter and deformable mirror into an eye. A blue return signal is sampled by a wavefront sensor, which sends a correction to the mirror. A corrected retinal image is formed at the output.</desc>
  <defs>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0,1 L 11,6 L 0,11 Z" fill="#ed9b1e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0,1 L 11,6 L 0,11 Z" fill="#2d77b7"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0,1 L 11,6 L 0,11 Z" fill="#6b7280"/>
    </marker>
    <style>
      .label { font-family: Verdana, Helvetica, sans-serif; font-size: 26px; fill: #182230; }
      .small { font-family: Verdana, Helvetica, sans-serif; font-size: 20px; fill: #52606d; }
      .component { fill: #ffffff; stroke: #263849; stroke-width: 4; }
      .illumination { fill: none; stroke: #ed9b1e; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
      .return { fill: none; stroke: #2d77b7; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .control { fill: none; stroke: #6b7280; stroke-width: 4; stroke-dasharray: 10 10; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- Light-path key -->
  <g aria-label="Light path key">
    <path d="M 72 70 H 132" class="illumination"/>
    <text x="150" y="78" class="small">illumination</text>
    <path d="M 325 70 H 385" class="return"/>
    <text x="403" y="78" class="small">return signal</text>
  </g>

  <!-- Laser -->
  <g aria-label="Laser source">
    <rect x="65" y="280" width="155" height="104" rx="12" class="component" fill="#eef5fb"/>
    <circle cx="109" cy="332" r="19" fill="#ed9b1e"/>
    <path d="M 100 332 H 118 M109 323 V341" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 154 315 H 192 M 154 332 H 202 M 154 349 H 192" stroke="#ed9b1e" stroke-width="4" stroke-linecap="round"/>
    <text x="142" y="336" class="label">Laser</text>
  </g>

  <!-- Beam splitter -->
  <g aria-label="Beam splitter">
    <rect x="348" y="275" width="92" height="92" rx="8" class="component"/>
    <path d="M 361 352 L 427 289" stroke="#6a7b8a" stroke-width="8" stroke-linecap="round"/>
    <text x="304" y="410" class="label">Beam splitter</text>
  </g>

  <!-- Deformable mirror -->
  <g aria-label="Deformable mirror">
    <path d="M 590 230 Q 640 275 590 320" fill="#dceafb" stroke="#263849" stroke-width="4"/>
    <path d="M 602 238 Q 636 275 602 312" fill="none" stroke="#2d77b7" stroke-width="4"/>
    <text x="526" y="365" class="label">Deformable mirror</text>
  </g>

  <!-- Eye and retinal spot -->
  <g aria-label="Eye and retina">
    <ellipse cx="898" cy="264" rx="157" ry="133" fill="#f8ddd3" stroke="#263849" stroke-width="5"/>
    <ellipse cx="772" cy="264" rx="27" ry="64" fill="#bfe0ee" stroke="#263849" stroke-width="4"/>
    <path d="M 1026 157 Q 1082 264 1026 371" fill="none" stroke="#e75d43" stroke-width="14" stroke-linecap="round"/>
    <circle cx="1017" cy="264" r="8" fill="#ed9b1e"/>
    <text x="870" y="438" class="label">Eye / retina</text>
  </g>

  <!-- Illumination path: laser, splitter, mirror, retina -->
  <path d="M 220 332 H 348" class="illumination"/>
  <path d="M 440 321 H 580" class="illumination"/>
  <path d="M 616 274 H 1007" class="illumination"/>

  <!-- Return path: retinal reflection through mirror and splitter -->
  <path d="M 1007 286 H 616" class="return"/>
  <path d="M 590 299 H 440" class="return"/>
  <path d="M 394 367 V 488" class="return"/>
  <path d="M 440 321 L 694 541" class="return"/>

  <!-- Wavefront sensor -->
  <g aria-label="Wavefront sensor">
    <rect x="282" y="490" width="224" height="111" rx="12" class="component" fill="#eef5fb"/>
    <g fill="#2d77b7">
      <circle cx="324" cy="530" r="10"/><circle cx="364" cy="530" r="10"/><circle cx="404" cy="530" r="10"/><circle cx="444" cy="530" r="10"/>
      <circle cx="324" cy="567" r="10"/><circle cx="364" cy="567" r="10"/><circle cx="404" cy="567" r="10"/><circle cx="444" cy="567" r="10"/>
    </g>
    <text x="305" y="646" class="label">Wavefront sensor</text>
  </g>

  <!-- Controller and feedback -->
  <g aria-label="Controller">
    <rect x="72" y="520" width="140" height="82" rx="12" fill="#eef1f5" stroke="#6b7280" stroke-width="4"/>
    <text x="105" y="570" class="label">Control</text>
  </g>
  <path d="M 282 548 H 212" class="control"/>
  <path d="M 142 520 V 455 H 555 V 323" class="control"/>

  <!-- Corrected image -->
  <g aria-label="Corrected retinal image">
    <rect x="716" y="493" width="202" height="135" rx="12" class="component" fill="#f7fbff"/>
    <circle cx="817" cy="560" r="44" fill="#f9d9d2" stroke="#e75d43" stroke-width="4"/>
    <g fill="#e75d43">
      <circle cx="796" cy="539" r="5"/><circle cx="817" cy="539" r="5"/><circle cx="838" cy="539" r="5"/>
      <circle cx="796" cy="560" r="5"/><circle cx="817" cy="560" r="5"/><circle cx="838" cy="560" r="5"/>
      <circle cx="796" cy="581" r="5"/><circle cx="817" cy="581" r="5"/><circle cx="838" cy="581" r="5"/>
    </g>
    <text x="691" y="674" class="label">Corrected retinal image</text>
  </g>
</svg>
